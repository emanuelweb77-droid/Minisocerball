
name: Compilar Mini Soccer Aim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto ZIP
        run: |
          mkdir -p proyecto
          unzip -q MiniSoccerAim_GitHub_corregido.zip -d proyecto
          find proyecto -maxdepth 3 -type f

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniSoccerAim-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
